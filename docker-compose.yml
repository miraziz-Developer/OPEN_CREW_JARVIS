# JARVIS server rejimi. Ishga tushirish:  ./server.sh
services:
  jarvis:
    build: .
    image: open-crew-jarvis:latest
    container_name: jarvis
    restart: unless-stopped
    shm_size: "1gb"                      # Chromium (browser worker) uchun
    volumes:
      - ./.env:/app/.env                 # sozlamalar (juftlashish .env ga egalarni yozadi)
      - jarvis-data:/data                # xotira, tokenlar, missiyalar, loglar
      - openclaw-home:/home/node/.openclaw
    ports:
      - "127.0.0.1:7890:7890"            # dashboard faqat serverning o'zida; masofadan: ssh -L 7890:localhost:7890 server

volumes:
  jarvis-data:
  openclaw-home:
